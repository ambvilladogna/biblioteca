<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Micologica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f9f7f1;
            --ink: #2a2419;
            --mushroom: #8b6f47;
            --spore: #d4a574;
            --moss: #4a5f3a;
            --accent: #c17a3f;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Crimson Pro', serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            border-bottom: 3px solid var(--mushroom);
            padding-bottom: 30px;
            margin-bottom: 40px;
            position: relative;
        }
        
        h1 {
            font-family: 'Libre Baskerville', serif;
            font-size: 3.5rem;
            color: var(--mushroom);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: var(--moss);
            font-style: italic;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        input[type="search"] {
            flex: 1;
            min-width: 250px;
            padding: 12px 18px;
            border: 2px solid var(--mushroom);
            background: white;
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            border-radius: 0;
        }
        
        input[type="search"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(193, 122, 63, 0.1);
        }
        
        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .tag-filter {
            padding: 6px 14px;
            background: transparent;
            border: 1.5px solid var(--moss);
            color: var(--moss);
            cursor: pointer;
            font-family: 'Crimson Pro', serif;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .tag-filter:hover {
            background: var(--moss);
            color: var(--paper);
        }
        
        .tag-filter.active {
            background: var(--moss);
            color: var(--paper);
            border-color: var(--moss);
        }
        
        .stats {
            font-size: 0.95rem;
            color: var(--mushroom);
            padding: 8px 0;
        }
        
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }
        
        .book-card {
            background: white;
            border: 1px solid #e0ddd5;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 2px 2px 8px rgba(42, 36, 25, 0.08);
        }
        
        .book-card:hover {
            box-shadow: 4px 4px 16px rgba(42, 36, 25, 0.15);
            transform: translateY(-2px);
        }
        
        .book-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--spore);
            transition: background 0.3s;
        }
        
        .book-card:hover::before {
            background: var(--accent);
        }
        
        .book-series {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.3rem;
            color: var(--ink);
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .book-volume {
            font-size: 1rem;
            color: var(--mushroom);
            margin-bottom: 12px;
            font-style: italic;
        }
        
        .book-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e8e5dd;
            font-size: 0.95rem;
        }
        
        .meta-row {
            display: flex;
            gap: 8px;
        }
        
        .meta-label {
            font-weight: 600;
            color: var(--moss);
            min-width: 70px;
        }
        
        .meta-value {
            color: var(--ink);
        }
        
        .book-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .tag {
            padding: 3px 10px;
            background: var(--spore);
            color: var(--ink);
            font-size: 0.85rem;
            border-radius: 2px;
        }
        
        .copies-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--moss);
            color: white;
            padding: 4px 10px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--mushroom);
            font-size: 1.2rem;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .books-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Biblioteca Micologica</h1>
            <p class="subtitle">Catalogo della collezione del circolo</p>
        </header>
        
        <div class="controls">
            <input type="search" id="searchInput" placeholder="Cerca per titolo, autore, editore...">
            <div class="filter-tags">
                <button class="tag-filter" data-tag="monografia">Monografie</button>
                <button class="tag-filter" data-tag="amb">AMB</button>
                <button class="tag-filter" data-tag="russole">Russole</button>
            </div>
        </div>
        
        <div class="stats">
            Visualizzati <span id="visibleCount">115</span> di <span id="totalCount">115</span> volumi
        </div>
        
        <div class="books-grid" id="booksGrid">
            <!-- Books will be inserted here by JavaScript -->
        </div>
        
        <div class="no-results" id="noResults" style="display: none;">
            Nessun volume trovato con i criteri di ricerca selezionati.
        </div>
    </div>
    
    <script>
        // Sample data (in production, this would be loaded from your CSV or converted JSON)
        const books = [
            {
                id: 1,
                opera: "Monografia illustrata del Genere Russula in Europa",
                volume: "Tomo Primo",
                copie: 1,
                autori: "Mauro Sarnari",
                editore: "ASSOCIAZIONE MICOLOGICA BRESADOLA",
                data: "2007",
                tags: ["russole", "amb", "monografia"],
                note: ""
            },
            {
                id: 2,
                opera: "Monografia illustrata del Genere Russula in Europa",
                volume: "Tomo Secondo",
                copie: 1,
                autori: "Mauro Sarnari",
                editore: "ASSOCIAZIONE MICOLOGICA BRESADOLA",
                data: "2007",
                tags: ["russole", "amb", "monografia"],
                note: ""
            },
            {
                id: 3,
                opera: "Nuovo Trattato di Micologia",
                volume: "*",
                copie: 1,
                autori: "Mario Galli",
                editore: "MAZZOTTA",
                data: "",
                tags: [],
                note: ""
            },
            {
                id: 30,
                opera: "Le guide des Champignos France et Europe",
                volume: "",
                copie: 1,
                autori: "Guillaume Eyssartier, Pierre Roux",
                editore: "",
                data: "",
                tags: [],
                note: ""
            },
            {
                id: 80,
                opera: "Funghi Europaei",
                volume: "1 – Agaricus L: Fr. (Psalliota Fr.)",
                copie: 1,
                autori: "A. Cappelli",
                editore: "Candusso Editrice",
                data: "1984",
                tags: [],
                note: ""
            },
            {
                id: 89,
                opera: "Mycena d'Europa",
                volume: "",
                copie: 1,
                autori: "Giovanni Robich",
                editore: "AMB Fondazione Centro Studi Micologici",
                data: "",
                tags: [],
                note: ""
            }
        ];
        
        const booksGrid = document.getElementById('booksGrid');
        const searchInput = document.getElementById('searchInput');
        const tagFilters = document.querySelectorAll('.tag-filter');
        const visibleCount = document.getElementById('visibleCount');
        const totalCount = document.getElementById('totalCount');
        const noResults = document.getElementById('noResults');
        
        let activeTag = null;
        
        function renderBooks(filteredBooks) {
            booksGrid.innerHTML = '';
            
            if (filteredBooks.length === 0) {
                booksGrid.style.display = 'none';
                noResults.style.display = 'block';
            } else {
                booksGrid.style.display = 'grid';
                noResults.style.display = 'none';
                
                filteredBooks.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    
                    const volumeDisplay = book.volume ? `<div class="book-volume">${book.volume}</div>` : '';
                    const copiesDisplay = book.copie > 1 ? `<div class="copies-badge">${book.copie} copie</div>` : '';
                    
                    const tagsHtml = book.tags.length > 0 ? 
                        `<div class="book-tags">${book.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>` : '';
                    
                    card.innerHTML = `
                        ${copiesDisplay}
                        <div class="book-series">${book.opera}</div>
                        ${volumeDisplay}
                        <div class="book-meta">
                            ${book.autori ? `<div class="meta-row"><span class="meta-label">Autori:</span><span class="meta-value">${book.autori}</span></div>` : ''}
                            ${book.editore ? `<div class="meta-row"><span class="meta-label">Editore:</span><span class="meta-value">${book.editore}</span></div>` : ''}
                            ${book.data ? `<div class="meta-row"><span class="meta-label">Anno:</span><span class="meta-value">${book.data}</span></div>` : ''}
                        </div>
                        ${tagsHtml}
                    `;
                    
                    booksGrid.appendChild(card);
                });
            }
            
            visibleCount.textContent = filteredBooks.length;
            totalCount.textContent = books.length;
        }
        
        function filterBooks() {
            const searchTerm = searchInput.value.toLowerCase();
            
            let filtered = books.filter(book => {
                const matchesSearch = !searchTerm || 
                    book.opera.toLowerCase().includes(searchTerm) ||
                    (book.volume && book.volume.toLowerCase().includes(searchTerm)) ||
                    (book.autori && book.autori.toLowerCase().includes(searchTerm)) ||
                    (book.editore && book.editore.toLowerCase().includes(searchTerm));
                
                const matchesTag = !activeTag || book.tags.includes(activeTag);
                
                return matchesSearch && matchesTag;
            });
            
            renderBooks(filtered);
        }
        
        searchInput.addEventListener('input', filterBooks);
        
        tagFilters.forEach(button => {
            button.addEventListener('click', () => {
                const tag = button.dataset.tag;
                
                if (activeTag === tag) {
                    activeTag = null;
                    button.classList.remove('active');
                } else {
                    tagFilters.forEach(b => b.classList.remove('active'));
                    activeTag = tag;
                    button.classList.add('active');
                }
                
                filterBooks();
            });
        });
        
        // Initial render
        renderBooks(books);
    </script>
</body>
</html>
